name: Build and Release Customized AnduinOS ISO

on:
  push:
    branches:
      - '*' # Runs automatically on any push updates to your custom branch
  workflow_dispatch: # Keeps the manual "Run workflow" trigger button active

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    container:
      image: ubuntu:resolute
      options: --privileged # Grants necessary rights to run mount/debootstrap inside Docker
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Adding lsb-release solves the validation problem natively
      - name: Install System Build Dependencies and Fix Permissions
        run: |
          apt update
          apt install -y make debootstrap xorriso squashfs-tools mtools grep sed git sudo lsb-release
          
          # Fix Git ownership warning inside the Docker shared workspace path
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          
          # Create a non-root "builduser" with passwordless sudo rights
          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers
          
          # Transfer workspace folder ownership to our new unprivileged user profile
          chown -R builduser:builduser "$GITHUB_WORKSPACE"

      - name: Execute AnduinOS Make Pipeline
        run: |
          # Drop root status and execute the compilation script as builduser
          su builduser -c "make"

      - name: Generate Dynamic Version Tag
        id: versioning
        run: |
          TAG_NAME="custom-build-$(date +'%Y.%m.%d-%H%M')"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Generated Tag Name: ${TAG_NAME}"

      - name: Publish Custom ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: "Custom AnduinOS Build (${{ steps.versioning.outputs.tag_name }})"
          body: |
            Automated cloud build of your customized AnduinOS ISO image.
            
            - Built from Branch: `${{ github.ref_name }}`
            - Commit SHA: `${{ github.sha }}`
          draft: false
          prerelease: false
          files: |
            src/dist/*.iso
            dist/*.iso
