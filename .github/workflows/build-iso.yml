name: Build and Release Customized AnduinOS ISO

on:
  push:
    branches:
      - '*' # Runs automatically on any push updates to your custom branch
  workflow_dispatch: # Keeps the manual "Run workflow" trigger button active

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    container:
      image: ubuntu:resolute
      options: --privileged # Grants necessary rights to run mount/debootstrap inside Docker
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

       Tar-up and prep the local workspace configuration permissions
      - name: Configure Container Environment and Users
        run: |
          apt update
          apt install -y sudo git
          
          # Create a clean, unprivileged non-root user with passwordless administrative rights
          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers
          
          # Pass over repo workspace permissions to our customized user context
          chown -R builduser:builduser "$GITHUB_WORKSPACE"

      - name: Execute AnduinOS Make Pipeline
        run: |
          # Drop root privileges and complete everything cleanly inside the user space
          su builduser -c "
            sudo apt update && \
            sudo apt install -y make debootstrap xorriso squashfs-tools mtools grep sed lsb-release systemd && \
            
            # --- CRITICAL SYSTEMCTL MOCK FIX ---
            # Create a fake systemctl binary that intercepts service reloads and returns 'success'
            sudo tee /usr/local/bin/systemctl > /dev/null <<'EOF'
          #!/bin/sh
          echo '[MOCK SYSTEMCTL] Safely passing container command: \$*'
          exit 0
          EOF
            sudo chmod +x /usr/local/bin/systemctl && \
            # -----------------------------------

            git config --global --add safe.directory '$GITHUB_WORKSPACE' && \
            make
          "

      - name: Generate Dynamic Version Tag
        id: versioning
        run: |
          TAG_NAME="custom-build-$(date +'%Y.%m.%d-%H%M')"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Generated Tag Name: ${TAG_NAME}"

      - name: Publish Custom ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: "Custom AnduinOS Build (${{ steps.versioning.outputs.tag_name }})"
          body: |
            Automated cloud build of your customized AnduinOS ISO image.
            
            - Built from Branch: `${{ github.ref_name }}`
            - Commit SHA: `${{ github.sha }}`
          draft: false
          prerelease: false
          files: |
            src/dist/*.iso
            dist/*.iso
